baseURL = 'https://combig.github.io/'
title = 'caihui‘s blog'
theme = 'PaperMod'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
paginate = 10
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

# 中文摘要/字数统计更准确
hasCJKLanguage = true

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  env = 'production'
  author = ''
  description = '一个用 Hugo + PagesCMS 搭建的个人博客'
  keywords = ['个人博客', 'Hugo', '写作']
  authorEmoji = '👋'
  DateFormat = '2006-01-02'
  defaultTheme = 'light'         # 固定亮色，不再跟随系统/日出日落
  disableThemeToggle = true
  ShowReadingTime = false
  ShowWordCount = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hideMeta = false
  hideFooter = false
  comments = false

  [params.label]
    text = 'caihui‘s blog'
    iconHeight = 28

  [params.homeInfoParams]
    Title ='''欢迎来到我的个人网站，写点随笔和生活碎碎念。'''
    Content = '''欢迎来到我的个人网站，记录随笔和生活碎碎念。'''

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/combig'
  [[params.socialIcons]]
    name = 'rss'
    url = '/index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = '文章'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 40

# 首页额外输出 JSON，供 PaperMod 站内搜索使用
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = 'github-dark'
