# PagesCMS 配置文档：https://pagescms.org/docs/configuration/

media:
  input: static/images
  output: /images
  extensions:
    - jpg
    - jpeg
    - png
    - gif
    - svg
    - webp
    - avif
    - ico

content:
  # ---------- 博客文章 ----------
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: date
    view:
      fields: [title, date, draft, tags]
      primary: title
      sort: date
      search: title
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
      - name: lastmod
        label: 最后修改
        type: date
      - name: draft
        label: 草稿（勾选后不公开）
        type: boolean
      - name: tags
        label: 标签
        type: string
        list: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: description
        label: 摘要
        type: text
        description: 显示在文章列表和搜索结果里，可留空
      - name: cover
        label: 封面图
        type: object
        fields:
          - name: image
            label: 图片
            type: image
          - name: alt
            label: 替代文字
            type: string
      - name: body
        label: 正文
        type: rich-text

  # ---------- 独立页面（关于 / 归档等） ----------
  - name: pages
    label: 独立页面
    type: collection
    path: content
    exclude:
      - posts
    filename: "{primary}.md"
    view:
      fields: [title, draft]
      primary: title
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: draft
        label: 草稿（勾选后不公开）
        type: boolean
      - name: description
        label: 摘要
        type: text
      - name: body
        label: 正文
        type: rich-text
