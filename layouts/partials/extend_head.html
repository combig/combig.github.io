<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#2563eb">

<style>
  /* 全站标题：大小与字重统一（覆盖主题默认 40px / 加粗） */
  h1, h2, h3, h4, h5, h6,
  .logo a,
  .post-title,
  .entry-header h2 {
    font-weight: 400 !important;
    font-size: 22px !important;
  }

  /* 文章页：标题与正文之间的两处间距缩小为 8px */
  .post-header { margin-top: 8px; }
  .post-content { margin-top: 8px; font-size: 15px;}

  /* 首页：隐藏欢迎大标题与社交/资料页脚，欢迎文字段落去掉默认边距 */
  .home-info .entry-header { display: none; }
  .home-info .entry-footer { display: none; }
  .home-info .entry-content p { margin: 0; }

  /* 导航栏 logo 与文章正文左对齐 */
  :root {
    --nav-width: var(--main-width);
  }

  /* 首页欢迎板块：上下间距统一为 8px */
  .first-entry {
    min-height: auto;
    justify-content: flex-start;
    margin: 0 0 8px;
  }
.main {
    padding-top: 4px !important;
}
</style>

<script>
(function () {
  // 按北京时间日出日落自动切换明暗模式
  var lat = 39.9042, lng = 116.4074;
  var n = new Date();
  var bj = new Date(n.getTime() + n.getTimezoneOffset() * 60000 + 8 * 3600000);
  function sun(date) {
    var rad = Math.PI / 180;
    var day = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    var M = 0.9856 * day - 3.289;
    var L = (M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634) % 360;
    var RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = Math.floor(L / 90) * 90 + ((RA % 90) + 90) % 90;
    RA = RA / 15;
    var sinDec = 0.39782 * Math.sin(L * rad);
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(90.833 * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return { rise: 6, set: 18 };
    var H = (180 / Math.PI) * Math.acos(cosH);
    return {
      rise: ((360 - H) / 15 + RA - 0.06571 * (day - 1) - 6.622 + 8 + 24) % 24,
      set: ((H) / 15 + RA - 0.06571 * (day - 1) - 6.622 + 8 + 24) % 24
    };
  }
  var s = sun(bj);
  var h = bj.getHours() + bj.getMinutes() / 60;
  var theme = (h >= s.rise && h < s.set) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('pref-theme', theme); } catch (e) {}
})();
</script>
